openapi: 3.0.1
info:
  title: PetCare — каталог врачей
  version: 1.0.0
  description: Поиск ветеринаров и управление их профилями в клиниках.
servers:
  - url: http://localhost:8080/api/v1
    description: Пример адреса локального backend
tags:
  - name: Врачи
    description: Поиск врачей и управление их профилями
paths:
  /doctors:
    get:
      tags: [Врачи]
      operationId: findDoctors
      summary: Найти врачей
      description: Возвращает действующих врачей нужной специализации в указанном районе.
      parameters:
        - name: districtId
          in: query
          required: true
          description: Идентификатор района клиники
          schema:
            type: integer
            minimum: 1
        - name: specializationId
          in: query
          required: true
          description: Идентификатор специализации врача
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Список врачей; если совпадений нет, возвращается пустой массив
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doctor'
        '400':
          description: Некорректный или отсутствующий параметр поиска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
    post:
      tags: [Врачи]
      operationId: createDoctor
      summary: Добавить врача
      description: Сотрудник клиники создаёт профиль врача в своей клинике.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorCreate'
      responses:
        '201':
          description: Профиль врача создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '400':
          description: Некорректные данные врача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Сотрудник не авторизован
        '403':
          description: Нет права добавлять врача в указанную клинику
        '500':
          description: Ошибка сервера
  /doctors/{doctorId}:
    put:
      tags: [Врачи]
      operationId: updateDoctor
      summary: Обновить данные врача
      description: Сотрудник клиники заменяет данные профиля своего врача.
      security:
        - BearerAuth: []
      parameters:
        - name: doctorId
          in: path
          required: true
          description: Идентификатор профиля врача
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorUpdate'
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '400':
          description: Некорректный doctorId или данные врача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Сотрудник не авторизован
        '403':
          description: Врач относится к другой клинике
        '404':
          description: Профиль врача не найден
        '500':
          description: Ошибка сервера
    delete:
      tags: [Врачи]
      operationId: deactivateDoctor
      summary: Скрыть врача из поиска
      description: >-
        Деактивирует профиль, сохраняя историю записей. Если у врача есть будущие
        записи, их сначала нужно обработать в модуле записи.
      security:
        - BearerAuth: []
      parameters:
        - name: doctorId
          in: path
          required: true
          description: Идентификатор профиля врача
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Профиль скрыт; тело ответа отсутствует
        '400':
          description: Некорректный doctorId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Сотрудник не авторизован
        '403':
          description: Врач относится к другой клинике
        '404':
          description: Профиль врача не найден
        '409':
          description: У врача есть будущие записи
        '500':
          description: Ошибка сервера
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Токен сотрудника клиники
  schemas:
    Doctor:
      type: object
      description: Профиль врача, возвращаемый API
      required: [doctorId, clinicId, clinicName, districtId, displayName, specializationIds, experienceYears, description]
      properties:
        doctorId:
          type: integer
          example: 42
        clinicId:
          type: integer
          example: 18
        clinicName:
          type: string
          description: Название из каталога клиник
          example: ВетЛиния
        districtId:
          type: integer
          description: Район из каталога клиник
          example: 3
        displayName:
          type: string
          example: Анна Петрова
        specializationIds:
          type: array
          items:
            type: integer
          example: [5, 9]
        experienceYears:
          type: integer
          example: 7
        description:
          type: string
          example: Ветеринарный терапевт, работает с кошками и собаками.
    DoctorCreate:
      type: object
      description: Данные нового врача
      required: [clinicId, displayName, specializationIds, experienceYears, description]
      properties:
        clinicId:
          type: integer
          minimum: 1
          description: Клиника, в которой работает врач
        displayName:
          type: string
          minLength: 1
        specializationIds:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
        experienceYears:
          type: integer
          minimum: 0
        description:
          type: string
          minLength: 1
    DoctorUpdate:
      type: object
      description: Обновляемые поля врача; клинику этим методом не меняют
      required: [displayName, specializationIds, experienceYears, description]
      properties:
        displayName:
          type: string
          minLength: 1
        specializationIds:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
        experienceYears:
          type: integer
          minimum: 0
        description:
          type: string
          minLength: 1
    Error:
      type: object
      description: Сообщение об ошибке
      required: [message]
      properties:
        message:
          type: string
          example: Проверьте данные запроса.
