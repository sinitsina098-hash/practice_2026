openapi: "3.0.1"
info:
  version: 1.0.0 | 26.09.2026
  title: Сервис уведомлений PetCare
  description: API микросервиса для создания, переноса, изменения, отмены напоминаний о визите к ветеринару и получения их статуса
security:
  - BearerAuth: []
  - OAuth2: []
servers:
  - url: /api/v1
  - url: https://{Host}/{EnvironmentPrefix}{MicroserviceName}/api/v1
    variables:
      Host:
        default: host.ru
        description: Host, на котором развернут микросервис
      EnvironmentPrefix:
        default: ''
        description: Префикс тестового стенда (feature environment)
      MicroserviceName:
        default: notification-service
        description: Имя, под которым микросервис развернут в кластере
tags:
  - name: Reminders
    description: Операции с напоминаниями о визите

paths:
  /reminders:
    post:
      tags:
        - Reminders
      operationId: createReminder
      summary: Создать напоминание о визите
      description: Метод проверяет данные, рассчитывает время отправки и сохраняет напоминание
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReminderRq'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderRp'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

  /reminders/{reminderId}:
    get:
      tags:
        - Reminders
      operationId: getReminder
      summary: Получить статус напоминания
      description: Метод находит напоминание и возвращает его текущее состояние
      parameters:
        - $ref: '#/components/parameters/reminderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderRp'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error

    patch:
      tags:
        - Reminders
      operationId: updateReminderTargetAction
      summary: Изменить напоминание при изменении записи
      description: Метод находит напоминание и изменяет целевое действие в его тексте
      parameters:
        - $ref: '#/components/parameters/reminderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTargetActionRq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderTextRp'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error

  /reminders/{reminderId}/reschedule:
    post:
      tags:
        - Reminders
      operationId: rescheduleReminder
      summary: Перенести напоминание при переносе записи
      description: Метод находит напоминание и пересчитывает время отправки по новой дате визита
      parameters:
        - $ref: '#/components/parameters/reminderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleReminderRq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderRp'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error

  /reminders/{reminderId}/cancel:
    post:
      tags:
        - Reminders
      operationId: cancelReminder
      summary: Отменить напоминание при отмене записи
      description: Метод находит напоминание и переводит его в статус «отменено»
      parameters:
        - $ref: '#/components/parameters/reminderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderStatusRp'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2:
      type: oauth2
      flows:
        password:
          tokenUrl: https://auth.tusvc.bcs.ru/auth/realms/perseus/protocol/openid-connect/token
          scopes: {}

  parameters:
    reminderId:
      name: reminderId
      in: path
      description: Идентификатор напоминания
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ReminderStatus:
      type: string
      description: |
        Статус напоминания:
        * SCHEDULED - запланировано
        * SENT - отправлено
        * CANCELLED - отменено
        * ERROR - ошибка отправки
      enum:
        - SCHEDULED
        - SENT
        - CANCELLED
        - ERROR
      example: SCHEDULED

    CreateReminderRq:
      type: object
      description: Данные для создания напоминания
      required:
        - appointmentId
        - ownerContact
        - visitDateTime
        - clinic
        - doctor
      properties:
        appointmentId:
          type: string
          format: uuid
          description: Идентификатор записи
        ownerContact:
          type: string
          description: Контакт владельца
          example: "+79991234567"
        visitDateTime:
          type: string
          format: date-time
          description: Дата и время визита
          example: "2026-10-01T10:30:00Z"
        clinic:
          type: string
          description: Клиника
          example: Ветклиника «Лапа»
        doctor:
          type: string
          description: Врач
          example: Иванова А.А.
        targetAction:
          type: string
          description: Целевое действие, которое указывается в тексте напоминания
          example: Взять ветеринарный паспорт

    RescheduleReminderRq:
      type: object
      description: Новые дата и время визита
      required:
        - visitDateTime
      properties:
        visitDateTime:
          type: string
          format: date-time
          description: Новые дата и время визита
          example: "2026-10-03T15:00:00Z"

    UpdateTargetActionRq:
      type: object
      description: Новое целевое действие
      required:
        - targetAction
      properties:
        targetAction:
          type: string
          description: Новое целевое действие
          example: Прийти за 10 минут до приёма

    ReminderRp:
      type: object
      description: Напоминание
      properties:
        reminderId:
          type: string
          format: uuid
          description: Идентификатор напоминания
        sendAt:
          type: string
          format: date-time
          description: Время отправки
          example: "2026-09-30T10:30:00Z"
        status:
          $ref: '#/components/schemas/ReminderStatus'

    ReminderTextRp:
      type: object
      description: Напоминание с обновлённым текстом
      properties:
        reminderId:
          type: string
          format: uuid
          description: Идентификатор напоминания
        text:
          type: string
          description: Новый текст напоминания
        status:
          $ref: '#/components/schemas/ReminderStatus'

    ReminderStatusRp:
      type: object
      description: Статус напоминания
      properties:
        reminderId:
          type: string
          format: uuid
          description: Идентификатор напоминания
        status:
          $ref: '#/components/schemas/ReminderStatus'