openapi: 3.0.3
info:
  title: Event Service
  description: Сервис для создания и просмотра мероприятий на платформе EventHub
  version: 1.0.0
servers:
  - url: https://api.eventhub.ru/api/v1
tags:
  - name: events
    description: Методы для работы с мероприятиями
paths:
  /events:
    get:
      tags:
        - events
      summary: Получить список мероприятий
      parameters:
        - name: status
          in: query
          required: false
          description: Фильтр по статусу мероприятия
          schema:
            type: string
      responses:
        '200':
          description: Список мероприятий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          description: Некорректные параметры запроса
    post:
      tags:
        - events
      summary: Создать мероприятие
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Мероприятие создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Некорректные данные мероприятия
  /events/{eventId}:
    get:
      tags:
        - events
      summary: Получить мероприятие по идентификатору
      parameters:
        - name: eventId
          in: path
          required: true
          description: Идентификатор мероприятия
          schema:
            type: string
      responses:
        '200':
          description: Мероприятие найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Мероприятие не найдено
    put:
      tags:
        - events
      summary: Обновить мероприятие
      parameters:
        - name: eventId
          in: path
          required: true
          description: Идентификатор мероприятия
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Мероприятие обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Мероприятие не найдено
    delete:
      tags:
        - events
      summary: Удалить мероприятие
      parameters:
        - name: eventId
          in: path
          required: true
          description: Идентификатор мероприятия
          schema:
            type: string
      responses:
        '200':
          description: Мероприятие удалено
        '404':
          description: Мероприятие не найдено
components:
  schemas:
    Event:
      type: object
      properties:
        eventId:
          type: string
          description: Идентификатор мероприятия
        name:
          type: string
          description: Название мероприятия
        date:
          type: string
          description: Дата проведения
        place:
          type: string
          description: Место проведения
        ticketsTotal:
          type: integer
          description: Количество билетов
    EventInput:
      type: object
      properties:
        name:
          type: string
          description: Название мероприятия
        date:
          type: string
          description: Дата проведения
        place:
          type: string
          description: Место проведения
        ticketsTotal:
          type: integer
          description: Количество билетов
