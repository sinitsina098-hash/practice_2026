swagger: "2.0"

info:
  description: "Analytics Service"
  version: "1.0.0"
  title: "EventHub Analytics Service"

host: "api.eventhub.example.com"
basePath: "/v1"

tags:
- name: "events"
  description: "Данные мероприятий для расчета статистики"

- name: "sales"
  description: "Регистрация продаж и отмен"

- name: "statistics"
  description: "Получение статистики продаж"

schemes:
- "https"

paths:

  /events/capacity:
    put:
      tags:
      - "events"
      operationId: "updateEventCapacity"

      consumes:
      - "application/json"

      produces:
      - "application/json"

      parameters:
      - name: "eventId"
        in: "query"
        required: true
        type: "string"

      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/CapacityRequest"

      responses:
        "200":
          description: "Количество билетов успешно сохранено"

        "400":
          description: "Некорректные данные мероприятия"
          schema:
            $ref: "#/definitions/ErrorResponse"

        "500":
          description: "Внутренняя ошибка сервиса"
          schema:
            $ref: "#/definitions/ErrorResponse"


  /sales:
    post:
      tags:
      - "sales"
      operationId: "registerSale"

      consumes:
      - "application/json"

      produces:
      - "application/json"

      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/CreateSaleRequest"

      responses:
        "200":
          description: "Продажа успешно зарегистрирована"
          schema:
            $ref: "#/definitions/Sale"

        "400":
          description: "Некорректные данные продажи"
          schema:
            $ref: "#/definitions/ErrorResponse"

        "500":
          description: "Внутренняя ошибка сервиса"
          schema:
            $ref: "#/definitions/ErrorResponse"


  /sales/cancellations:
    post:
      tags:
      - "sales"
      operationId: "registerSaleCancellation"

      consumes:
      - "application/json"

      produces:
      - "application/json"

      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/CancellationRequest"

      responses:
        "200":
          description: "Отмена успешно зарегистрирована"
          schema:
            $ref: "#/definitions/Cancellation"

        "400":
          description: "Некорректные данные отмены"
          schema:
            $ref: "#/definitions/ErrorResponse"

        "404":
          description: "Продажа с указанным saleId не найдена"
          schema:
            $ref: "#/definitions/ErrorResponse"

        "500":
          description: "Внутренняя ошибка сервиса"
          schema:
            $ref: "#/definitions/ErrorResponse"


  /events/statistics:
    get:
      tags:
      - "statistics"
      operationId: "getEventStatistics"

      produces:
      - "application/json"

      parameters:
      - name: "eventId"
        in: "query"
        required: true
        type: "string"

      - name: "from"
        in: "query"
        required: false
        type: "string"

      - name: "to"
        in: "query"
        required: false
        type: "string"

      responses:
        "200":
          description: "Статистика мероприятия успешно получена"
          schema:
            $ref: "#/definitions/EventStatistics"

        "400":
          description: "Некорректно указан eventId или период статистики"
          schema:
            $ref: "#/definitions/ErrorResponse"

        "404":
          description: "Мероприятие с указанным eventId не найдено"
          schema:
            $ref: "#/definitions/ErrorResponse"

        "500":
          description: "Внутренняя ошибка сервиса"
          schema:
            $ref: "#/definitions/ErrorResponse"


definitions:

  CapacityRequest:
    type: "object"
    required:
    - "totalTickets"

    properties:
      totalTickets:
        type: "integer"


  CreateSaleRequest:
    type: "object"
    required:
    - "eventId"
    - "ticketId"
    - "price"
    - "purchasedAt"

    properties:
      eventId:
        type: "string"

      ticketId:
        type: "string"

      price:
        type: "number"

      purchasedAt:
        type: "string"


  Sale:
    type: "object"

    properties:
      saleId:
        type: "string"


  CancellationRequest:
    type: "object"
    required:
    - "saleId"
    - "cancelledAt"

    properties:
      saleId:
        type: "string"

      cancelledAt:
        type: "string"


  Cancellation:
    type: "object"

    properties:
      cancellationId:
        type: "string"


  EventStatistics:
    type: "object"
    required:
    - "totalTickets"
    - "soldTickets"
    - "availableTickets"
    - "cancelledSales"
    - "totalRevenue"
    - "salesPerHour"
    - "salesPerDay"
    - "revenuePerHour"
    - "revenuePerDay"
    - "updatedAt"

    properties:

      totalTickets:
        type: "integer"

      soldTickets:
        type: "integer"

      availableTickets:
        type: "integer"

      cancelledSales:
        type: "integer"

      totalRevenue:
        type: "number"

      salesPerHour:
        type: "array"
        items:
          $ref: "#/definitions/SalesPeriod"

      salesPerDay:
        type: "array"
        items:
          $ref: "#/definitions/SalesPeriod"

      revenuePerHour:
        type: "array"
        items:
          $ref: "#/definitions/RevenuePeriod"

      revenuePerDay:
        type: "array"
        items:
          $ref: "#/definitions/RevenuePeriod"

      updatedAt:
        type: "string"


  SalesPeriod:
    type: "object"

    properties:
      periodStart:
        type: "string"

      periodEnd:
        type: "string"

      soldTickets:
        type: "integer"


  RevenuePeriod:
    type: "object"

    properties:
      periodStart:
        type: "string"

      periodEnd:
        type: "string"

      revenue:
        type: "number"


  ErrorResponse:
    type: "object"

    properties:
      code:
        type: "string"

      message:
        type: "string"