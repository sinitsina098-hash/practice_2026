openapi: "3.0.1"
info:
  version: 1.0.0
  title: Ticket Service API
  description: Полностью линейный API без ссылок
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: bookings

paths:
  /bookings:
    get:
      tags: [bookings]
      summary: Получить список броней
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [BOOKED, PAID, CANCELLED] }
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bookingId: { type: string }
                    status: { type: string }
    
    post:
      tags: [bookings]
      summary: Создать новую бронь
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId: { type: string }
                seatIds: { type: array, items: { type: string } }
      responses:
        '201':
          description: Бронь создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingId: { type: string }
                  status: { type: string }
