openapi: "3.0.1"
info:
  version:  1.0.0 | 26.09.2026
  title: MS TicketCheck
  description: API микросервиса проверки электронных билетов EventHub. Сервис принимает QR/идентификатор билета на входе, проверяет валидность, погашает билет и отдаёт контролёру результат проверки.
security:
  - BearerAuth: []
  - OAuth2: []
servers:
  - url: /api/v1
  - url: https://{Host}/{EnvironmentPrefix}{MicroserviceName}/api/v1
    variables:
        Host:
          default: host.ru
          description: Host на котором развернут микросервис
        EnvironmentPrefix:
          default: ''
          description: |
            Префикс конкретного тестового стенда, выделенного под задачу (feature environment).
            Фактически позволяет окончательно идентифицировать host микросервиса, т.к. хостинге мс в кластере они все хостятся на одном dns - условном host.ru
        MicroserviceName:
          default: ticket-check
          description: |
            Имя под которым микросервис развернут в кластере микросервисов
            Фактически позволяет окончательно идентифицировать host микросервиса при обращениях к нему
tags:
    - name: ticket-check operations
      description: Тэгирование методов для логической группировки по предметной области, например методы работающие с проверкой и погашением билетов стоит тэгировать как ticket-check operations
paths:
  /tickets:
    get:
      tags:
        - ticket-check operations
      operationId: GetTickets
      summary: Получить список билетов
      description: Метод возвращает список билетов, доступных к проверке на мероприятии. При запросе список фильтруется по идентификатору мероприятия и статусу билета
      parameters:
        - in: query
          name: ticketFilter
          required: true
          schema:
            $ref: "#/components/schemas/ticketFilter"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketsRp"
        400:
          description: Bad Request
        401:
          description: Unauthorized
        404:
          description: Not Found
        500:
          description: Internal Service Error
    post:
      tags:
        - ticket-check operations
      operationId: VerifyTicket
      summary: Проверить билет
      description: Метод принимает QR-код или идентификатор билета и выполняет проверку на входе. При успешной проверке билет погашается, факт прохода сохраняется
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketRq'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        204:
          description: No Content
        400:
          description: Bad Request
        401:
          description: Unauthorized
        404:
          description: Not Found
        500:
          description: Internal Service Error
  /tickets/{ticketId}:
    delete:
      tags:
        - ticket-check operations
      operationId: deleteTicketCheckIn
      summary: Отменить погашение билета по его идентификатору
      description: Метод отменяет факт прохода и возвращает билет в статус оплачен. Используется контролёром при ошибочном скане
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            $ref: "#/components/parameters/ticketId"
      responses:
        200:
          description: OK
        400:
          description: Bad Request
        401:
          description: Unauthorized
        404:
          description: Not Found
        500:
          description: Internal Service Error
    put:
      tags:
        - ticket-check operations
      operationId: UpdateTicket
      summary: Обновить статус билета
      description: Метод обновляет объект билета по его идентификатору по атрибутам переданным в запросе. Используется для ручного погашения или смены точки входа
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            $ref: "#/components/parameters/ticketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketRq'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        204:
          description: No Content
        400:
          description: Bad Request
        401:
          description: Unauthorized
        404:
          description: Not Found
        500:
          description: Internal Service Error
components:
  securitySchemes:
      BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      OAuth2:
         type: oauth2
         flows:
          password:
            tokenUrl: https://auth.tusvc.bcs.ru/auth/realms/perseus/protocol/openid-connect/token
            scopes: {}
  parameters:
    ticketId:
      name: ticketId
      in: path
      description: Уникальный идентификатор билета
      required: true
      schema:
        type: string
        format: uuid
    ticketFilter:
      name: ticketFilter
      in: query
      description: Фильтр параметр списка билетов
      required: true
      schema:
        $ref: '#/components/schemas/ticketFilter'
  schemas:
    ticketFilter:
      description: Фильтр параметр билета. Передаётся идентификатор мероприятия, для которого контролёр запрашивает список билетов
      type: string
    TicketsRp:
        description: Список объектов билет
        type: array
        items:
          $ref: '#/components/schemas/Ticket'
    Ticket:
      type: object
      description: Объект билет
      required:
        - ticketId
      properties:
        ticketId:
         type: string
         format: uuid
         description: Уникальный идентификатор билета
        eventId:
         type: string
         format: uuid
         description: Идентификатор мероприятия, к которому относится билет
        holderName:
         type: string
         description: ФИО владельца билета
        tariff:
         type: string
         description: Тариф билета, например Standard или VIP
        seat:
         type: string
         description: Место в зале
        status:
         type: string
         description: Текущий статус билета. Допустимые значения PAID, REDEEMED, REFUNDED, REVOKED
        result:
         type: string
         description: Результат последней проверки. Допустимые значения VALID, ALREADY_USED, NOT_FOUND, WRONG_EVENT, NOT_PAID, EXPIRED, NOT_STARTED, REVOKED
        gateId:
         type: string
         description: Идентификатор точки входа, на которой выполнен проход
        checkedAt:
         type: string
         format: date-time
         description: Дата и время последней проверки билета
        redeem:
         type: boolean
         description: Признак, что билет должен быть погашен при успешной проверке
    TicketRq:
      type: object
      description: Тело запроса на проверку или обновление билета
      required:
        - eventId
        - redeem
      properties:
        ticketCode:
         type: string
         description: Строка из QR-кода билета. Передаётся, если контролёр сканирует QR
        ticketId:
         type: string
         format: uuid
         description: Идентификатор билета. Передаётся, если QR недоступен
        eventId:
         type: string
         format: uuid
         description: Идентификатор мероприятия, на вход которого выполняется проверка
        sessionId:
         type: string
         description: Идентификатор сеанса мероприятия
        gateId:
         type: string
         description: Идентификатор точки входа контролёра
        redeem:
         type: boolean
         description: Признак погашения. true — проверить и погасить, false — только проверить
        status:
         type: string
         description: Новый статус билета при обновлении через PUT
        holderName:
         type: string
         description: ФИО владельца билета
        tariff:
         type: string
         description: Тариф билета
        seat:
         type: string
         description: Место в зале