openapi: "3.0.1"
info:
  version: 1.0.0 | 26.09.2026
  title: Функция создания профиля клиента
  description: Сервис профилей приложения FitTrack. Позволяет создать профиль после регистрации и получить данные профиля
security:
  - BearerAuth: []
servers:
  - url: https://api.fittrack.ru/api/v1
paths:
  /profiles:
    post:
      summary: Создать профиль спортсмена
      description: Метод создает профиль спортсмена после регистрации и возвращает его уникальный идентификатор
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: string
                format: uuid
        400:
          description: Bad Request
        401:
          description: Unauthorized
        500:
          description: Internal Service Error
  /profiles/{profileId}:
    get:
      summary: Получить профиль по идентификатору
      description: Метод возвращает данные профиля спортсмена по его идентификатору
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        400:
          description: Bad Request
        401:
          description: Unauthorized
        404:
          description: Not Found
        500:
          description: Internal Service Error
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Profile:
      type: object
      description: Профиль спортсмена
      properties:
        profileId:
          type: string
          description: Уникальный идентификатор профиля
        firstName:
          type: string
          description: Имя
        lastName:
          type: string
          description: Фамилия
        birthDate:
          type: string
          description: Дата рождения (ГГГГ-ММ-ДД)
        gender:
          type: string
          description: Пол (male / female)
        heightCm:
          type: integer
          description: Рост, см
        weightKg:
          type: number
          description: Вес, кг
        goal:
          type: string
          description: Цель тренировок (weight_loss, muscle_gain, endurance, health)
        level:
          type: string
          description: Уровень подготовки (beginner, intermediate, advanced)