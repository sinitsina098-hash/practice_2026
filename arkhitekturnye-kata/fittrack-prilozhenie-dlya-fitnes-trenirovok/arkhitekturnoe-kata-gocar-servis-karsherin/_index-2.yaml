openapi: "3.0.1"
info:
  version: 1.0.0 | 26.09.2026
  title: Сервис прогресса пользователя FitTrack
  description: Микросервис для получения и удаления информации о тренировках пользователя за выбранный период.
security:
  - BearerAuth: []
servers:
  - url: https://api.fittrack.ru/api/v1
paths:
  /getProgress:
    post:
      tags:
        - progress
      summary: Тренировки пользователя
      description: Метод получает информацию о тренировках пользователя за выбранный период.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetProgressRequest'
      responses:
        201:
          description: Тренировки пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingSummary'
        204:
          description: No Content
        400:
          description: Bad Request
        401:
          description: Unauthorized
        500:
          description: Internal Service Error
    delete:
      tags:
        - progress
      summary: Удалить тренировку
      description: Метод удаляет информацию о тренировке пользователя за выбранный период.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProgressRequest'
      responses:
        201:
          description: No Content
        204:
          description: No Content
        400:
          description: Bad Request
        401:
          description: Unauthorized
        500:
          description: Internal Service Error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    GetProgressRequest:
      type: object
      required:
        - userId
        - dateFrom
        - dateTo
      properties:
        userId:
          type: string
          description: id пользователя
          example: "e7883ea2-de24-45c0-ae0e-d65c92a7cff7"
        dateFrom:
          type: string
          format: date
          description: Дата от
          example: "2026-08-01"
        dateTo:
          type: string
          format: date
          description: Дата по
          example: "2026-08-31"

    DeleteProgressRequest:
      type: object
      required:
        - userId
        - idTraining
        - dateFrom
        - dateTo
      properties:
        userId:
          type: string
          description: id пользователя
          example: "e7883ea2-de24-45c0-ae0e-d65c92a7cff7"
        idTraining:
          type: string
          description: id тренировки
          example: "e7883ea2de2445c0ae0ed65c92a70001"
        dateFrom:
          type: string
          format: date
          description: Дата от
          example: "2026-08-01"
        dateTo:
          type: string
          format: date
          description: Дата по
          example: "2026-08-31"

    TrainingSummary:
      type: object
      description: Элемент массива тренировок
      properties:
        nameTraining:
          type: string
          description: Название тренировки
          example: "Strength Training"
        count:
          type: integer
          description: Количество
          example: 25
