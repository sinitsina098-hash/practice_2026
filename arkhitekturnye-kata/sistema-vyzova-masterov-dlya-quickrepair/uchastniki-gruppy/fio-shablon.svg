<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Мобильное приложение водителя обращается через GET /parking-history к сервису MS Parking History, который читает данные из базы данных истории парковок и получает данные о завершённых сессиях от Parking Session Service.</desc>
