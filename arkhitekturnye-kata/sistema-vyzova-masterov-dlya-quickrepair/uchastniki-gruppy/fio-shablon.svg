<svg width="100%" viewBox="0 0 800 376" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title style="fill:rgb(0, 0, 0);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:400">Архитектура MS Parking History</title>
<desc style="fill:rgb(0, 0, 0);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:400">Мобильное приложение водителя обращается через GET /parking-history к сервису MS Parking History, который читает данные из базы данных истории парковок, получает данные о сессиях от Parking Session Service и статус оплаты от Payment Service.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="255" y="20" width="270" height="44" rx="8" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90)"/>
<text x="390" y="42" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);font-size:14px;font-weight:500">Мобильное приложение водителя</text>
</g>

<line x1="390" y1="64" x2="390" y2="140" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>
<text x="390" y="105" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">GET /parking-history</text>

<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="260" y="140" width="260" height="56" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="390" y="168" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-size:14px;font-weight:500">MS Parking History</text>
</g>

<path d="M390 196L390 230L150 230L150 280" fill="none" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>
<path d="M390 196L390 230L400 230L400 280" fill="none" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>
<path d="M390 196L390 230L650 230L650 280" fill="none" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>

<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="40" y="280" width="220" height="56" rx="8" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90)"/>
<text x="150" y="300" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);font-size:14px;font-weight:500">База данных</text>
<text x="150" y="318" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95, 94, 90);font-size:12px;font-weight:400">истории парковок</text>
</g>

<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="290" y="280" width="220" height="56" rx="8" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183)"/>
<text x="400" y="300" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-size:14px;font-weight:500">Parking Session Service</text>
<text x="400" y="318" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-size:12px;font-weight:400">передаёт данные о сессиях</text>
</g>

<g style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="540" y="280" width="220" height="56" rx="8" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183)"/>
<text x="650" y="300" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-size:14px;font-weight:500">Payment Service</text>
<text x="650" y="318" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-size:12px;font-weight:400">передаёт статус оплаты</text>
</g>
</svg>
