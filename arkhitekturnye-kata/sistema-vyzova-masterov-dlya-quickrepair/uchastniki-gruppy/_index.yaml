openapi: "3.0.1"
# Метаданные API
info: {version: 1.0.0, title: MS Tariff Management}
servers: [{url: /api/v1}]
# Пути и методы HTTP
paths:
  # Управление коллекцией тарифов
  /tariffs:
    # Получить список тарифов с фильтрацией
    get:
      parameters:
        - {in: query, name: zoneId, schema: {type: string}}
        - {in: query, name: active, schema: {type: boolean}}
      responses: #описание схемы ответа
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array #массив
                items: {$ref: "#/components/schemas/Tariff"} #элементы массива
        401: {description: Unauthorized} #ошибка клиента
        500: {description: Internal Service Error} #ошибка сервера
    # Создать новый тариф
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TariffRq"}
      responses:
        201:
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tariff"}
        400: {description: Bad Request}
        401: {description: Unauthorized}
        500: {description: Internal Service Error}
  # Операции с конкретным тарифом по его ID
  /tariffs/{tariffId}:
    # Получить тариф по идентификатору
    get:
      parameters:
        - {name: tariffId, in: path, required: true, schema: {type: string}}
      responses:
        200:
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tariff"}
        401: {description: Unauthorized}
        404: {description: Not Found}
        500: {description: Internal Service Error}
    # Обновить существующий тариф
    put:
      parameters:
        - {name: tariffId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TariffRq"}
      responses:
        200: {description: OK}
        400: {description: Bad Request}
        401: {description: Unauthorized}
        404: {description: Not Found}
        500: {description: Internal Service Error}
    # Удалить тариф
    delete:
      parameters:
        - {name: tariffId, in: path, required: true, schema: {type: string}}
      responses:
        204: {description: No Content}
        401: {description: Unauthorized}
        404: {description: Not Found}
        500: {description: Internal Service Error}
  # Расчёт стоимости парковки по тарифу
  /tariffs/calculate:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zoneId, startTime, endTime]
              properties:
                zoneId: {type: string}
                startTime: {type: string}
                endTime: {type: string}
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCost: {type: number}
                  currency: {type: string}
                  tariffId: {type: string}
        400: {description: Bad Request}
        401: {description: Unauthorized}
        500: {description: Internal Service Error}
# Компоненты
components:
  # Схемы данных (модели запросов и ответов)
  schemas:
    TariffRq:
      type: object
      required: [zoneId, timeFrom, timeTo, pricePerHour, currency]
      properties:
        zoneId: {type: string}
        timeFrom: {type: string}
        timeTo: {type: string}
        pricePerHour: {type: number}
        currency: {type: string}
    # Модель тарифа, возвращаемая в ответах
    Tariff:
      type: object
      properties:
        tariffId: {type: string}
        zoneId: {type: string}
        timeFrom: {type: string}
        timeTo: {type: string}
        pricePerHour: {type: number}
        currency: {type: string}