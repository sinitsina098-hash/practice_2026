openapi: "3.0.1"
info:
  version:  1.0.0 | 01.04.2024
  title: UserInteraction
  description: Регистрация, вход в систему, обновление данных и удаление аккаунта
security:
  - BearerAuth: []
  - OAuth2: []
servers:
  - url: /api/v1
  - url: https://{Host}/{EnvironmentPrefix}{MicroserviceName}/api/v1
    variables:
        Host:
          default: host.ru
          description: Host на котором развернут микросервис
        EnvironmentPrefix:
          default: ''
          description: |
            Префикс конкретного тестового стенда, выделенного под задачу (feature environment).
            Фактически позволяет окончательно идентифицировать host микросервиса, т.к. хостинге мс в кластере они все хостятся на одном dns - условном host.ru
        MicroserviceName:
          default: UserInteraction
          description: |
            Имя под которым микросервис развернут в кластере микросервисов
            Фактически позволяет окончательно идентифицировать host микросервиса при обращениях к нему
tags:
    - name: register
      description: методы, используемые для регистрации пользователя
    - name: auth
      description: методы, используемые для входа в систему
    - name: refresh
      description: методы, используемые для обновления данных пользователя
    - name: delete
      description: методы, используемые для удаления данных пользователя
paths:
  /resgister:
    post:
      tags: 
        - register
      operationId: CreateUser
      summary: Создать аккаунт пользователя
      description: Метод создает аккаунт
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcesRp'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                  $ref: '#/components/parameters/resourceId'
        204:
          description: No Content
        400:
          description: Bad Request
        404:
          description: Not Found
        500:
          description: Internal Service Error
  /delete:  
    delete:
      tags: 
        - delete
      operationId: deleteUser
      summary: Удалить аккаунт
      description: Метод удаляет аккаунт по его идентификаторам
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            $ref: "#/components/parameters/resourceId"
      responses:
        200:
          description: OK
        400:
          description: Bad Request
        401:
          description: Unauthorized
        404:
          description: Not Found
        500:
          description: Internal Service Error
  /refresh:  
    put:
      tags: 
        - refresh
      operationId: UpdateResource
      summary: Обновить объект
      description: Метод обновляет данные аккаунта(пароль)
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRq'
              
      responses:
        200:
          description: OK
        204:
          description: No Content
        400:
          description: Bad Request
        401:
          description: Unauthorized
        404:
          description: Not Found
        500:
          description: Internal Service Error
  /auth:
    post:
      tags:
        - auth
      operationId: UserEntering
      summary: Вход пользователя в аккаунт
      description: Метод запрашивает логин и пароль
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcesRp'
              
      responses:
        200:
          description: OK
        204:
          description: No Content
        400:
          description: Bad Request
        404:
          description: Not Found
        500:
          description: Internal Service Error
components:
  securitySchemes:
      BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      OAuth2:
         type: oauth2
         flows:
          password:
            tokenUrl: https://auth.tusvc.bcs.ru/auth/realms/perseus/protocol/openid-connect/token
            scopes: {}
  parameters:  
    resourceId:
      name: resourceId
      in: path
      description: Уникальный идентификатор
      required: true
      schema:
        type: string
        format: uuid
    resourceFilter:
      name: resourceFilter
      in: query
      description: Фильтр параметр
      required: true
      schema:
        $ref: '#/components/schemas/resourceFilter'
  schemas:
    resourceFilter:
      description: Фильтр параметр ресурса
      type: string
    ResourcesRp: 
        description: Список объектов ресурс
        type: array
        items:
          $ref: '#/components/schemas/Resource'
    Resource:
      type: object
      description: Объект ресурс
      required: 
        - resourceId
      properties:
        login:
         type: string
         description: Логин
        password:
         type: string
         description: Пароль

    ResourceRq:
      $ref: '#/components/schemas/Resource'
    
   