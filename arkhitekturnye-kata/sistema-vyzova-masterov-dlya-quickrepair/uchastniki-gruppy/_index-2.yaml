openapi: 3.0.1
info:
  title: MS Cartography Service
  version: 1.0.0
  description: API для управления парковочными зонами
servers:
  - url: /api/v1
tags:
  - name: zones
    description: Операции с зонами
paths:
  /parking-zones:
    post:
      tags:
        - zones
      summary: Создать парковочную зону
      description: Метод добавляет новую зону на карту
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneRequest'
      responses:
        '201':
          description: Зона успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneResponse'
        '400':
          description: Ошибка в данных запроса
        '500':
          description: Внутренняя ошибка сервера

components:
  schemas:
    ZoneRequest:
      type: object
      required:
        - name
        - points
      properties:
        name:
          type: string
          description: Название зоны
          example: "Центральный район"
        points:
          type: array
          description: Список координат границы зоны
          items:
            type: string
          example: ["55.75, 37.61", "55.76, 37.62"]
    
    ZoneResponse:
      type: object
      properties:
        id:
          type: string
          description: ID созданной зоны
          example: "zone-123"
        status:
          type: string
          example: "success"