openapi: 3.0.1
info:
  title: MS Cartography Service
  version: 1.0.0
  description: API для управления парковочными зонами
servers:
  - url: /api/v1
tags:
  - name: zones
    description: Операции с зонами
paths:
  /parking-zones:
    post:
      tags:
        - zones
      summary: Создать парковочную зону
      description: Метод добавляет новую зону на карту
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneRequest'
      responses:
        '201':
          description: Зона успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneResponse'
        '400':
          description: Ошибка в данных запроса
        '500':
          description: Внутренняя ошибка сервера

components:
  schemas:
    ZoneRequest:
      type: object
      required:
        - name
        - points
      properties:
        login:
         type: string
         description: Логин
        password:
         type: string
         description: Пароль

    ResourceRq:
      $ref: '#/components/schemas/Resource'
    
    ZoneResponse:
      type: object
      properties:
        id:
          type: string
          description: ID созданной зоны
          example: "zone-123"
        status:
          type: string
          example: "success"