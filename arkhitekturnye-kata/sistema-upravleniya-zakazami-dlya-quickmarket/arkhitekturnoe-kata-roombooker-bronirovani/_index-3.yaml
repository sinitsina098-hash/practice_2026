openapi: 3.0.3
info:
  title: EduPath — модуль «Обучение и прогресс»
  version: 1.0.0
servers:
  - url: https://api.edupath.ru/v1
 
paths:
  /courses/{courseId}/lessons/{lessonId}/completions:
    post:
      summary: Отметить урок пройденным
      description: Засчитывает урок студенту и возвращает обновлённый прогресс по курсу. Студент определяется по токену.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: Уникальный ключ запроса, защищает от двойного клика
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCompletionRequest'
      responses:
        '201':
          description: Урок засчитан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonCompletion'
        '200':
          description: Урок уже был засчитан раньше (повторный запрос)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonCompletion'
        '400':
          description: Ошибка в запросе (неверные данные)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Пользователь не вошёл в систему
        '403':
          description: Студент не записан на курс
        '404':
          description: Курс или урок не найден
        '422':
          description: Видео не досмотрено, урок нельзя засчитать
 
components:
  schemas:
    LessonCompletionRequest:
      type: object
      required:
        - timeSpentSeconds
      properties:
        timeSpentSeconds:
          type: integer
          description: Сколько секунд студент провёл в уроке
          example: 840
        videoWatchedPercent:
          type: integer
          description: Сколько процентов видео просмотрено
          example: 95
    LessonCompletion:
      type: object
      properties:
        completionId:
          type: string
          description: ID записи о прохождении
          example: cmp-5521
        completedAt:
          type: string
          format: date-time
          description: Когда урок засчитан
        progressPercent:
          type: integer
          description: Процент прохождения всего курса
          example: 70
        finalTestAvailable:
          type: boolean
          description: Открыт ли итоговый тест (все уроки пройдены)
          example: false
    Error:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Поле timeSpentSeconds обязательно