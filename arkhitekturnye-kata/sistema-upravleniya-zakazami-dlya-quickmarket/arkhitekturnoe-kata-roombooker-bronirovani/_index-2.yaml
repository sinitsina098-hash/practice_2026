openapi: 3.0.3
info:
  title: EduPath Course Enrollment API
  description: >-
    REST API функциональной зоны каталога и записей модульного монолита EduPath.
    Операция создаёт запись текущего авторизованного студента на выбранный курс.
  version: 1.0.0
servers:
  - url: /api/v1

security:
  - BearerAuth: []

tags:
  - name: Enrollments
    description: Операции записи студентов на курсы

paths:
  /courses/{courseId}/enrollments:
    post:
      tags:
        - Enrollments
      summary: Записать текущего студента на курс
      description: >-
        Web SPA вызывает метод после подтверждения записи студентом. Идентификатор
        студента определяется по Bearer-токену. Повтор запроса с тем же
        Idempotency-Key возвращает результат исходной операции и не создаёт дубль.
      operationId: createCourseEnrollment
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Запись на курс создана
          headers:
            Location:
              description: Относительная ссылка на созданный ресурс записи
              schema:
                type: string
                format: uri-reference
                example: /api/v1/enrollments/6f3eb847-629a-46b5-a7b0-6bdcf20f83a1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '409':
          $ref: '#/components/responses/EnrollmentConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      description: Идентификатор выбранного курса
      schema:
        type: string
        format: uuid
      example: 6db36e37-e26d-41aa-8813-8bac35d5a732
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ одной попытки записи, сформированный Web SPA
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
      example: enroll_7f2c9d50d8a84b6f

  schemas:
    EnrollmentRp:
      type: object
      required:
        - enrollmentId
        - courseId
        - status
        - enrolledAt
        - links
      properties:
        enrollmentId:
          type: string
          format: uuid
          description: Идентификатор созданной записи
          example: 6f3eb847-629a-46b5-a7b0-6bdcf20f83a1
        courseId:
          type: string
          format: uuid
          description: Идентификатор курса
          example: 6db36e37-e26d-41aa-8813-8bac35d5a732
        status:
          type: string
          description: Текущий статус записи
          enum:
            - ACTIVE
          example: ACTIVE
        enrolledAt:
          type: string
          format: date-time
          description: Дата и время создания записи в UTC
          example: '2026-09-26T06:45:00Z'
        links:
          type: object
          required:
            - self
            - course
          properties:
            self:
              type: string
              format: uri-reference
              example: /api/v1/enrollments/6f3eb847-629a-46b5-a7b0-6bdcf20f83a1
            course:
              type: string
              format: uri-reference
              example: /api/v1/courses/6db36e37-e26d-41aa-8813-8bac35d5a732

    Error:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: COURSE_NOT_FOUND
        message:
          type: string
          description: Понятное пользователю описание ошибки
          example: Курс не найден или недоступен для записи
        requestId:
          type: string
          description: Идентификатор запроса для диагностики
          example: req-b61c2e1f
        details:
          type: object
          additionalProperties: true
          description: Дополнительные сведения об ошибке

  responses:
    BadRequest:
      description: Некорректный courseId или Idempotency-Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Bearer-токен отсутствует, недействителен или истёк
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Пользователь не имеет роли студента
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CourseNotFound:
      description: Курс не найден, не опубликован или недоступен студенту
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EnrollmentConflict:
      description: Студент уже записан на курс или запись на курс закрыта
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
