openapi: 3.0.3
info:
  title: orders-service
  description: API микросервиса заявок QuickFix. Отвечает за создание заявки на ремонт, приём заявки мастером и отметку о завершении работы.
  version: "1.0.0 | 26.09.2026"
security:
  - BearerAuth: []
servers:
  - url: /api/v1
tags:
  - name: Orders
    description: Операции с заявками

paths:
  /orders:
    post:
      tags: [Orders]
      summary: Создать заявку
      description: Заказчик создаёт заявку на ремонт с описанием проблемы и адресом
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRq'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRs'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Orders]
      summary: Получить список заявок
      description: Возвращает список заявок, отфильтрованных по статусу и городу. Используется сервисом подбора мастеров для поиска новых заявок
      operationId: getOrders
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/city'
      responses:
        '200':
          description: Список заявок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderRs'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Получить заявку по идентификатору
      description: Возвращает текущий статус и детали заявки
      operationId: getOrderById
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Данные заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/accept:
    post:
      tags: [Orders]
      summary: Принять заявку в работу
      description: Мастер принимает заявку первым — заявка закрывается для остальных мастеров
      operationId: acceptOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptOrderRq'
      responses:
        '200':
          description: Заявка успешно принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заявка уже принята другим мастером или недоступна для приёма

  /orders/{orderId}/complete:
    post:
      tags: [Orders]
      summary: Отметить заявку как выполненную
      description: Мастер отмечает завершение работы по заявке
      operationId: completeOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOrderRq'
      responses:
        '200':
          description: Заявка завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заявка не находится в статусе "в работе"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    orderId:
      name: orderId
      in: path
      required: true
      description: Идентификатор заявки
      schema:
        type: integer
        format: int64
        example: 10245
    status:
      name: status
      in: query
      required: false
      description: "Фильтр по статусу заявки: new, accepted, completed, cancelled"
      schema:
        type: string
        example: new
    city:
      name: city
      in: query
      required: false
      description: Фильтр по городу
      schema:
        type: string
        example: "Казань"

  schemas:
    CreateOrderRq:
      type: object
      required: [customerId, category, description, address, latitude, longitude]
      properties:
        customerId:
          type: integer
          format: int64
          example: 5001
        category:
          type: string
          description: "Категория услуги: plumber, electrician, furniture_assembly"
          example: plumber
        description:
          type: string
          example: "Течёт кран на кухне"
        address:
          type: string
          example: "г. Казань, ул. Баумана, д. 12, кв. 5"
        latitude:
          type: number
          format: double
          example: 55.7887
        longitude:
          type: number
          format: double
          example: 49.1221

    AcceptOrderRq:
      type: object
      required: [masterId]
      properties:
        masterId:
          type: integer
          format: int64
          example: 7031

    CompleteOrderRq:
      type: object
      required: [masterId]
      properties:
        masterId:
          type: integer
          format: int64
          example: 7031
        comment:
          type: string
          example: "Заменён смеситель"

    OrderRs:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
          example: 10245
        status:
          type: string
          description: "new | accepted | completed | cancelled"
          example: accepted
        customerId:
          type: integer
          format: int64
          example: 5001
        masterId:
          type: integer
          format: int64
          nullable: true
          example: 7031
        category:
          type: string
          example: plumber
        description:
          type: string
          example: "Течёт кран на кухне"
        address:
          type: string
          example: "г. Казань, ул. Баумана, д. 12, кв. 5"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-26T09:15:00Z"
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-26T09:17:30Z"
        completedAt:
          type: string
          format: date-time
          nullable: true
          example: null

  responses:
    BadRequest:
      description: Некорректные входные данные
    Unauthorized:
      description: Отсутствует или недействителен токен доступа
    NotFound:
      description: Заявка с указанным идентификатором не найдена
    
   