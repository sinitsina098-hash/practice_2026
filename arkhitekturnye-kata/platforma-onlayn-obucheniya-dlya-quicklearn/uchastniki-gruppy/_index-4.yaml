  /notifications/{notificationId}:
    get:
      tags: [notifications]
      summary: Получить уведомление по идентификатору
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Уведомление найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Уведомление не найдено
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [notifications]
      summary: Обновить статус уведомления
      description: Используется для callback от провайдера доставки (push/sms/email) либо для отметки "прочитано".
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  $ref: '#/components/schemas/NotificationStatus'
      responses:
        '200':
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Уведомление не найдено
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}/notifications:
    get:
      tags: [notifications]
      summary: Получить историю уведомлений пользователя
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Список уведомлений пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsRp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: Токен авторизации отсутствует или недействителен
