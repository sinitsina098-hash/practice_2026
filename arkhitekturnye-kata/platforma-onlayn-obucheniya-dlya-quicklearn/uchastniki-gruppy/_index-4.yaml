openapi: 3.0.3
info:
  title: Notification Service
  description: Микросервис отправки и отслеживания статуса уведомлений пользователям платформы QuickFix по каналам push/sms/email.
  version: 1.0.0

servers:
  - url: https://app.quickfix.io/api/v1

paths:
  /notifications:
    post:
      tags: [notifications]
      summary: Отправить уведомление
      description: Принимает событие от бизнес-логики платформы и инициирует отправку уведомления пользователю.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRq'
      responses:
        '201':
          description: Уведомление принято в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/{notificationId}:
    get:
      tags: [notifications]
      summary: Получить уведомление по идентификатору
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Уведомление найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Уведомление не найдено
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [notifications]
      summary: Обновить статус уведомления
      description: Используется для callback от провайдера доставки (push/sms/email) либо для отметки "прочитано".
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  $ref: '#/components/schemas/NotificationStatus'
      responses:
        '200':
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Уведомление не найдено
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}/notifications:
    get:
      tags: [notifications]
      summary: Получить историю уведомлений пользователя
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Список уведомлений пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsRp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: Токен авторизации отсутствует или недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Внутренняя ошибка сервера, попробуйте повторить запрос позже
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Notification:
      type: object
      properties:
        id: { type: string, readOnly: true }
        userId: { type: string }
        type:
          type: string
          enum: [new_request, request_accepted, work_completed, payment_processed, master_rated]
        channel: { type: string, enum: [push, sms, email] }
        title:
          type: string
          readOnly: true
          description: Генерируется сервером из шаблона для данного type, не принимается от клиента
        body:
          type: string
          readOnly: true
          description: Генерируется сервером из шаблона для данного type, не принимается от клиента
        status:
          $ref: '#/components/schemas/NotificationStatus'
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    NotificationStatus:
      type: string
      enum: [queued, sent, delivered, failed, read]

    NotificationRq:
      type: object
      required: [userId, type, channel]
      additionalProperties: false
      properties:
        userId: { type: string }
        type:
          type: string
          enum: [new_request, request_accepted, work_completed, payment_processed, master_rated]
        channel: { type: string, enum: [push, sms, email] }
        templateData:
          $ref: '#/components/schemas/TemplateData'

    TemplateData:
      type: object
      additionalProperties: false
      properties:
        requestId: { type: string }
        masterName: { type: string, maxLength: 100 }
        amount: { type: number, minimum: 0 }
        rating: { type: integer, minimum: 1, maximum: 5 }

    NotificationsRp:
      type: array
      items:
        $ref: '#/components/schemas/Notification'

    Error:
      type: object
      properties:
        error: { type: string }
        field: { type: string }