openapi: 3.0.0
info:
  title: Availability Service
  version: 1.0.0
servers:
  - url: https://api.quickfix.ru/availability/v1

paths:
  /masters/{masterId}/schedule:
    get:
      summary: Получить расписание мастера
      parameters:
        - name: masterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySchedule'
        '404':
          description: Мастер не найден

    put:
      summary: Обновить расписание мастера
      parameters:
        - name: masterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyScheduleInput'
      responses:
        '200':
          description: Обновлено
        '400':
          description: Ошибка

  /masters/{masterId}/schedule/exceptions:
    post:
      summary: Добавить исключение
      parameters:
        - name: masterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleExceptionInput'
      responses:
        '201':
          description: Создано
        '400':
          description: Ошибка

  /masters/available:
    get:
      summary: Список свободных мастеров
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lon
          in: query
          schema:
            type: number
        - name: radiusKm
          in: query
          schema:
            type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableMasterItem'
        '400':
          description: Ошибка

components:
  schemas:
    WeeklySchedule:
      type: object
      properties:
        masterId:
          type: string
        days:
          type: array
          items:
            type: object
            properties:
              dayOfWeek:
                type: string
              startTime:
                type: string
              endTime:
                type: string
        updatedAt:
          type: string

    WeeklyScheduleInput:
      type: object
      properties:
        days:
          type: array
          items:
            type: object
            properties:
              dayOfWeek:
                type: string
              startTime:
                type: string
              endTime:
                type: string

    ScheduleExceptionInput:
      type: object
      properties:
        date:
          type: string
        type:
          type: string
        startTime:
          type: string
        endTime:
          type: string

    AvailableMasterItem:
      type: object
      properties:
        masterId:
          type: string
        category:
          type: string
        distanceKm:
          type: number
        status:
          type: string