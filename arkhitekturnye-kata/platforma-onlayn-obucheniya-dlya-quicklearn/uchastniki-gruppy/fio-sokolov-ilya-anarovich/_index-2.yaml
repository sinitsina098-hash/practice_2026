openapi: 3.0.3

info:
  title: Availability Service
  description: API микросервиса для работы с расписанием мастеров QuickFix
  version: "1.0.0 | 26.09.2026"

security:
  - BasicAuth: []

servers:
  - url: /api/v1
    description: Сервер Availability Service

tags:
  - name: Availability
    description: Операции с расписанием мастеров

paths:
  /masters/{masterId}/availability:
    get:
      tags:
        - Availability
      summary: Получить расписание мастера
      description: Возвращает рабочие интервалы мастера за выбранный период
      operationId: getMasterAvailability
      deprecated: false
      parameters:
        - $ref: "#/components/parameters/masterId"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
      responses:
        "200":
          description: Расписание мастера получено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitiesRp"
        "400":
          description: Неверный запрос
        "403":
          description: Доступ запрещен
        "404":
          description: Мастер не найден

    post:
      tags:
        - Availability
      summary: Создать рабочий интервал
      description: Добавляет новый рабочий интервал в расписание мастера
      operationId: createAvailability
      deprecated: false
      parameters:
        - $ref: "#/components/parameters/masterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRq"
      responses:
        "200":
          description: Рабочий интервал создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          description: Неверный запрос
        "403":
          description: Доступ запрещен
        "404":
          description: Мастер не найден

  /masters/{masterId}/availability/{intervalId}:
    put:
      tags:
        - Availability
      summary: Изменить рабочий интервал
      description: Обновляет данные существующего рабочего интервала
      operationId: updateAvailability
      deprecated: false
      parameters:
        - $ref: "#/components/parameters/masterId"
        - $ref: "#/components/parameters/intervalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRq"
      responses:
        "200":
          description: Рабочий интервал изменен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          description: Неверный запрос
        "403":
          description: Доступ запрещен
        "404":
          description: Рабочий интервал не найден

    delete:
      tags:
        - Availability
      summary: Удалить рабочий интервал
      description: Удаляет рабочий интервал из расписания мастера
      operationId: deleteAvailability
      deprecated: false
      parameters:
        - $ref: "#/components/parameters/masterId"
        - $ref: "#/components/parameters/intervalId"
      responses:
        "200":
          description: Рабочий интервал удален
        "403":
          description: Доступ запрещен
        "404":
          description: Рабочий интервал не найден

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic

  parameters:
    masterId:
      name: masterId
      in: path
      required: true
      description: Идентификатор мастера
      schema:
        type: integer
        format: int64
        example: 1

    intervalId:
      name: intervalId
      in: path
      required: true
      description: Идентификатор рабочего интервала
      schema:
        type: integer
        format: int64
        example: 10

    from:
      name: from
      in: query
      required: true
      description: Начало периода
      schema:
        type: string
        example: "2026-10-05 09:00"

    to:
      name: to
      in: query
      required: true
      description: Конец периода
      schema:
        type: string
        example: "2026-10-05 18:00"

  schemas:
    AvailabilityRq:
      type: object
      properties:
        start:
          type: string
          description: Начало рабочего интервала
          example: "2026-10-05 09:00"
        end:
          type: string
          description: Конец рабочего интервала
          example: "2026-10-05 18:00"
        status:
          type: string
          description: Статус доступности мастера
          example: AVAILABLE

    Availability:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        masterId:
          type: integer
          format: int64
          example: 1
        start:
          type: string
          example: "2026-10-05 09:00"
        end:
          type: string
          example: "2026-10-05 18:00"
        status:
          type: string
          example: AVAILABLE

    AvailabilitiesRp:
      type: array
      items:
        $ref: "#/components/schemas/Availability"